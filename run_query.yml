---
- name: Run SQL Server SELECT query
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sql_database: ""

  vars_files:
    - vault.yml

  tasks:

    - name: Validate database is provided
      ansible.builtin.assert:
        that:
          - sql_database | trim | length > 0
        fail_msg: "A database name must be provided."

    - name: Validate query is provided
      ansible.builtin.assert:
        that:
          - sql_query is defined
          - sql_query | trim | length > 0
        fail_msg: "A SQL query must be provided."

    - name: Validate query is SELECT only
      ansible.builtin.assert:
        that:
          - sql_query | trim | lower | regex_search('^select(\s|$)')
          - "';' not in sql_query"
        fail_msg: "Only a single SELECT query is allowed. Multiple SQL statements are not permitted."

    - name: Show database and query received by Ansible
      ansible.builtin.debug:
        msg:
          - "Database = {{ sql_database }}"
          - "SQL query = [{{ sql_query }}]"

    - name: Execute SELECT query
      community.general.odbc:
        dsn: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=172.26.0.1,1433;DATABASE={{ sql_database }};UID=ansible_reader;PWD={{ db_password }};Encrypt=yes;TrustServerCertificate=yes;"
        query: "{{ sql_query }}"
        commit: false
      register: query_result
      changed_when: false
      

    - name: Prepare query data for Excel export
      ansible.builtin.copy:
        content: |
          {
            "columns": {{ query_result.description | map(attribute='name') | list | to_json }},
            "rows": {{ query_result.results | to_json }}
          }
        dest: query_results.json
      changed_when: true

    - name: Export query results to Excel
      ansible.builtin.command:
        cmd: python3 export_to_excel.py query_results.json query_results.xlsx
      changed_when: true

    - name: Display query results
      ansible.builtin.debug:
        var: query_result.results

    - name: Display Excel file location
      ansible.builtin.debug:
        msg: "Excel file created: query_results.xlsx"